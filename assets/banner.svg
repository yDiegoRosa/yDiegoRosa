<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Diego Rosa — AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#101A2B"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#7FE9FF"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1E2A3A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="16" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="800" cy="140" rx="260" ry="180" fill="url(#halo)"/>

  <!-- neural net motif -->
  <g stroke="#00D9FF" stroke-width="1" opacity="0.35">
    <line x1="690" y1="70"  x2="790" y2="105"/>
    <line x1="690" y1="70"  x2="790" y2="175"/>
    <line x1="690" y1="140" x2="790" y2="105"/>
    <line x1="690" y1="140" x2="790" y2="175"/>
    <line x1="690" y1="210" x2="790" y2="105"/>
    <line x1="690" y1="210" x2="790" y2="175"/>
    <line x1="790" y1="105" x2="890" y2="140"/>
    <line x1="790" y1="175" x2="890" y2="140"/>
  </g>
  <g fill="#0D1117" stroke="#00D9FF" stroke-width="2" filter="url(#glow)">
    <circle cx="690" cy="70"  r="9">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="140" r="9">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="210" r="9">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="105" r="11">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="175" r="11">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="140" r="13" fill="#00D9FF" fill-opacity="0.18">
      <animate attributeName="r" values="13;15;13" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text block -->
  <text x="70" y="108" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="url(#name)" letter-spacing="-1">Diego Rosa</text>
  <rect x="72" y="126" width="220" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="72" y="164" font-family="'Fira Code',Consolas,monospace" font-size="19" fill="#00D9FF" letter-spacing="2">AI ENGINEER</text>
  <text x="72" y="196" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" fill="#8B98A9">Computer Vision · LLM Systems · MLOps</text>

  <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7FE9FF">
    <rect x="72"  y="216" width="132" height="26" rx="13" fill="#00D9FF" fill-opacity="0.10" stroke="#00D9FF" stroke-opacity="0.35"/>
    <text x="138" y="233" text-anchor="middle">Brazil · UTC-3</text>
    <rect x="214" y="216" width="160" height="26" rx="13" fill="#00D9FF" fill-opacity="0.10" stroke="#00D9FF" stroke-opacity="0.35"/>
    <text x="294" y="233" text-anchor="middle">Open to remote roles</text>
  </g>
</svg>
